<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Simple Multi-Agent - 출장 계획</title>
    <style>
        body { font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; background: #f5f6f8; margin: 0; color: #333; }
        .container { max-width: 860px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 1.5rem; border-bottom: 2px solid #4a6fa5; padding-bottom: 10px; }
        .card { background: #fff; border: 1px solid #e0e3e8; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card h2 { font-size: 1.05rem; margin: 0 0 12px; color: #4a6fa5; }
        .card.final { border: 2px solid #4a6fa5; }
        .card.final h2 { color: #2f4a70; }
        form .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #555; }
        input, textarea { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; font-family: inherit; }
        textarea { width: 100%; box-sizing: border-box; resize: vertical; }
        button { background: #4a6fa5; color: #fff; border: none; border-radius: 4px; padding: 10px 24px; font-size: 0.95rem; cursor: pointer; }
        button:hover { background: #3d5c8a; }
        pre { background: #f8f9fb; border: 1px solid #eceef2; border-radius: 6px; padding: 14px; white-space: pre-wrap; margin: 0; font-size: 0.9rem; }
        .summary { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
        .hint { font-size: 0.82rem; color: #888; margin: 6px 0 0; }
        .sub-request { font-size: 0.85rem; color: #666; background: #eef2f7; border-radius: 4px; padding: 8px 12px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Simple Multi-Agent - 출장 계획 만들기</h1>
    <p class="hint">Orchestrator Agent가 사용자 요청을 분해해서 하위 Agent(교통편/숙소/식당)별 요청 프롬프트를 작성하고, 결과를 조합해 하나의 출장 계획을 만듭니다.</p>

    <!-- 입력 폼 -->
    <div class="card">
        <h2>출장 정보 입력</h2>
        <form method="post" action="/plan">
            <div class="row">
                <div>
                    <label for="destination">출장 지역</label>
                    <input type="text" id="destination" name="destination" th:value="${destination} ?: '부산'" required>
                </div>
                <div>
                    <label for="startDate">시작일</label>
                    <input type="date" id="startDate" name="startDate" th:value="${startDate} ?: '2026-08-03'" required>
                </div>
                <div>
                    <label for="endDate">종료일</label>
                    <input type="date" id="endDate" name="endDate" th:value="${endDate} ?: '2026-08-05'" required>
                </div>
                <div>
                    <label for="budget">예산 (원)</label>
                    <input type="number" id="budget" name="budget" th:value="${budget} ?: 300000" required>
                </div>
            </div>
            <div class="row">
                <div style="flex: 1;">
                    <label for="request">요청 프롬프트</label>
                    <textarea id="request" name="request" rows="3" required
                              placeholder="예) 이동은 최대한 빠르게 하고, 숙소는 회사에서 가까운 곳으로, 저녁 회식용 한식당도 하나 추천해줘"
                              th:text="${request}"></textarea>
                    <p class="hint">Orchestrator가 이 요청을 읽고 하위 Agent별 요청 프롬프트를 스스로 작성합니다.</p>
                </div>
            </div>
            <button type="submit">Multi-Agent 실행</button>
        </form>
    </div>

    <!-- Orchestration 결과 -->
    <div th:if="${finalPlan != null}">
        <p class="summary"
           th:text="|${destination} / ${startDate} ~ ${endDate} (${nights}박) / 예산 ${#numbers.formatInteger(budget, 3, 'COMMA')}원|"></p>

        <!-- Orchestrator가 호출한 하위 Agent 실행 순서대로 표시 -->
        <div class="card" th:each="step, it : ${steps}">
            <h2 th:text="|${it.count}. ${step.agentName}|"></h2>
            <p class="sub-request" th:text="|Orchestrator의 요청: ${step.request}|"></p>
            <pre th:text="${step.result}"></pre>
        </div>

        <div class="card final">
            <h2>Orchestrator Agent - 최종 출장 계획</h2>
            <pre th:text="${finalPlan}"></pre>
        </div>
    </div>
</div>
</body>
</html>
